project_id = "sheria-docket"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "https://sheria-docket.vercel.app"
additional_redirect_urls = ["https://sheria-docket.vercel.app/callback"]
jwt_expiry = 3600

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "https://sheria-docket.vercel.app/callback"

[storage]
enabled = true
file_size_limit = "25MiB"

[analytics]
enabled = false
